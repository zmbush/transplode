[package]
edition = "2024"
name = "transplode"
version = "0.1.0"

[dependencies]
approx = "0.5.1"
clap = { version = "4.6.1", features = ["derive"] }
eyre = "0.6.12"
ffmpeg-sidecar = "2.5.2"
indicatif = { version = "0.18.6", features = ["tokio"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
path-slash = "0.2.1"
rpassword = "7.5.4"
run-on-drop = "1.0.0"
russh = { version = "0.62.2", features = [
    "flate2",
    "ring",
    "rsa",
], default-features = false }
russh-sftp = "2.3.0"
serde = { version = "1.0.228", features = ["derive"] }
shrinkpath = "0.1.1"
# ssh2 = { version = "0.9.6", features = ["openssl-on-win32"] }
tokio = { version = "1.52.3", features = [
    "fs",
    "macros",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
] }
toml = "1.1.2"
trash = "5.2.6"
walkdir = "2.5.0"
