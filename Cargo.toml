[package]
edition = "2024"
name = "transplode"
version = "0.1.0"

[dependencies]
approx = "0.5.1"
clap = { version = "4.6.1", features = ["derive"] }
eyre = "0.6.12"
ffmpeg-sidecar = "2.5.2"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
shrinkpath = "0.1.1"
tokio = { version = "1.52.3", features = [
    "macros",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
] }
toml = "1.1.2"
walkdir = "2.5.0"
